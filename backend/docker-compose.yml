services:
  postgres:
    image: postgres:16-alpine
    container_name: agriflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agriflow
      POSTGRES_PASSWORD: agriflow
      POSTGRES_DB: agriflow
    ports:
      - "5432:5432"
    volumes:
      - agriflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriflow -d agriflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agriflow_pg_data:
